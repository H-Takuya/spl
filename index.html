<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Splatoon3 戦績OCR</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #07070f;
      --panel: #10101c;
      --panel2: #14142a;
      --border: #1e1e38;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #7c3aed;
      --accent2: #22c55e;
      --accent-glow: rgba(124,58,237,.35);
      --warn: #ef4444;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background: var(--bg); color: var(--text); font-size: 14px; }

    /* ---- Header / Tabs ---- */
    header { background: #0a0a18; border-bottom: 1px solid var(--border); padding: 0 20px; display: flex; align-items: center; gap: 24px; position: sticky; top: 0; z-index: 50; }
    .logo { font-size: 16px; font-weight: 800; background: linear-gradient(90deg, #a855f7, #22c55e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; padding: 14px 0; white-space: nowrap; }
    .tabs { display: flex; gap: 4px; }
    .tab { padding: 14px 18px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; font-weight: 600; font-size: 13px; transition: color .15s, border-color .15s; white-space: nowrap; }
    .tab:hover { color: var(--text); }
    .tab.active { color: #a78bfa; border-bottom-color: #7c3aed; }

    /* ---- Page ---- */
    .page { display: none; padding: 16px; }
    .page.active { display: block; }

    /* ---- Cards ---- */
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; }
    .card-body { padding: 16px; }
    .card + .card { margin-top: 12px; }
    .section-title { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 10px; }

    /* ---- Grid layouts ---- */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .main-grid { display: grid; grid-template-columns: 440px 1fr; gap: 14px; }
    @media (max-width: 1024px) { .main-grid { grid-template-columns: 1fr; } }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 14px; }
    @media (max-width: 900px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
    .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 768px) { .charts-grid { grid-template-columns: 1fr; } }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    /* ---- Buttons ---- */
    .btn { appearance: none; border: 1px solid var(--border); background: var(--panel2); color: var(--text); padding: 8px 14px; border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer; transition: background .12s, border-color .12s; white-space: nowrap; }
    .btn:hover:not(:disabled) { background: #1e1e3a; border-color: #2e2e50; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn.primary { border-color: #5b21b6; background: #3b0f8c; color: #ddd6fe; }
    .btn.primary:hover:not(:disabled) { background: #4c1d95; }
    .btn.success { border-color: #14532d; background: #052e16; color: #86efac; }
    .btn.success:hover:not(:disabled) { background: #064e23; }
    .btn.danger { border-color: #7f1d1d; background: #2d0a0a; color: #fca5a5; }
    .btn.danger:hover:not(:disabled) { background: #420f0f; }

    /* ---- Form elements ---- */
    label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 3px; font-weight: 600; letter-spacing: .03em; }
    input, select, textarea { width: 100%; background: #0b0b18; color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px; outline: none; transition: border-color .12s; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; }
    select option { background: #0b0b18; }

    /* ---- Dropzone ---- */
    .dropzone { border: 2px dashed #2a2a48; border-radius: 12px; padding: 20px 16px; text-align: center; color: var(--muted); cursor: pointer; transition: border-color .15s, background .15s; }
    .dropzone:hover, .dropzone.drag { border-color: var(--accent); background: rgba(124,58,237,.07); }
    .dropzone strong { color: var(--text); }

    /* ---- Canvas ---- */
    canvas { width: 100%; height: auto; border-radius: 10px; background: #0b0b18; border: 1px solid var(--border); display: block; }
    #roiCanvas { display: none; }

    /* ---- Status ---- */
    .pill { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--border); color: var(--muted); }
    .badge { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 6px; font-weight: 700; }
    .badge.win { background: #052e16; color: #4ade80; border: 1px solid #14532d; }
    .badge.lose { background: #2d0a0a; color: #f87171; border: 1px solid #7f1d1d; }
    .info-box { background: rgba(124,58,237,.12); border: 1px solid rgba(124,58,237,.3); border-radius: 8px; padding: 8px 12px; font-size: 12px; color: #c4b5fd; margin-bottom: 10px; }
    .progress-wrap { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-top: 6px; }
    .progress-bar { height: 100%; background: var(--accent); border-radius: 2px; width: 0; transition: width .3s; }

    /* ---- Table ---- */
    .table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; white-space: nowrap; }
    th { background: #0d0d1e; color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); position: sticky; top: 0; }
    td { padding: 9px 12px; border-bottom: 1px solid #12122a; font-size: 13px; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,.02); }
    .sort-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 11px; padding: 0 2px; }
    .sort-btn.active { color: #a78bfa; }

    /* ---- Stat cards ---- */
    .stat-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
    .stat-card .val { font-size: 28px; font-weight: 800; line-height: 1; margin: 4px 0; }
    .stat-card .lbl { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
    .stat-card .sub { font-size: 11px; color: var(--muted); margin-top: 4px; }

    /* ---- Chart card ---- */
    .chart-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
    .chart-card h3 { margin: 0 0 12px; font-size: 13px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }

    /* ---- Filter bar ---- */
    .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
    .filter-bar select, .filter-bar input { width: auto; flex: 1; min-width: 120px; }

    /* ---- Scrollbar ---- */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2a44; border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <div class="logo">⚡ SPL3 OCR</div>
  <nav class="tabs">
    <div class="tab active" data-tab="analyze">📷 解析</div>
    <div class="tab" data-tab="records">📋 記録一覧</div>
    <div class="tab" data-tab="stats">📊 統計</div>
  </nav>
</header>

<!-- ===================== TAB: 解析 ===================== -->
<div id="tab-analyze" class="page active">
  <div class="main-grid">

    <!-- LEFT: image panel -->
    <div>
      <div class="card">
        <div class="card-body">
          <div id="drop" class="dropzone">
            <strong>スクショをドラッグ＆ドロップ</strong><br>
            <span style="font-size:12px">PNG / JPG 対応</span>
            <div style="height:10px"></div>
            <input id="file" type="file" accept="image/png,image/jpeg" style="display:none" />
            <div class="row" style="justify-content:center">
              <button id="pick" class="btn">ファイルを選ぶ</button>
            </div>
          </div>
          <div style="height:12px"></div>
          <canvas id="preview" width="1920" height="1080"></canvas>
          <canvas id="roiCanvas"></canvas>
          <div class="row" style="justify-content:space-between; margin-top:8px; flex-wrap:wrap; gap:6px">
            <span class="pill" id="imgMeta">画像未読込</span>
            <div class="row">
              <button id="rotateLeft" class="btn" disabled>↺</button>
              <button id="rotateRight" class="btn" disabled>↻</button>
              <button id="auto" class="btn primary" disabled>🔍 自動解析</button>
              <button id="reset" class="btn danger" disabled>リセット</button>
            </div>
          </div>
          <div id="ocrProgress" style="display:none; margin-top:8px">
            <div style="font-size:11px; color:var(--muted)" id="ocrStatus">解析中…</div>
            <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT: form panel -->
    <div>
      <div class="card">
        <div class="card-body">
          <div class="row" style="justify-content:space-between; margin-bottom:12px">
            <div>
              <div style="font-size:15px; font-weight:700;">抽出結果</div>
              <div style="font-size:11px; color:var(--muted)">誤認識は手で修正してから追加してください</div>
            </div>
            <div class="row">
              <button id="copyCsv" class="btn" disabled>CSVコピー</button>
              <button id="append" class="btn success" disabled>＋ 一覧に追加</button>
            </div>
          </div>

          <div class="info-box">
            ローカルOCR（Tesseract.js）で解析します。初回はモデル読み込みに数秒かかります。
          </div>

          <div class="grid-2" style="margin-bottom:10px">
            <div>
              <label>試合日時</label>
              <input id="matchAt" placeholder="2025-08-28 14:10" />
            </div>
            <div>
              <label>勝敗</label>
              <select id="result">
                <option value="">未設定</option>
                <option>WIN</option>
                <option>LOSE</option>
              </select>
            </div>
            <div>
              <label>ルール</label>
              <input id="mode" placeholder="レギュラー／バンカラ／Xなど" />
            </div>
            <div>
              <label>ステージ</label>
              <input id="stage" placeholder="マテガイ放水路 など" />
            </div>
            <div style="grid-column:1/-1">
              <label>ブキ</label>
              <input id="weapon" placeholder="わかばシューター など" />
            </div>
          </div>

          <div class="grid-3" style="margin-bottom:10px">
            <div><label>キル (K)</label><input id="kills" type="number" inputmode="numeric" /></div>
            <div><label>デス (D)</label><input id="deaths" type="number" inputmode="numeric" /></div>
            <div><label>アシスト (A)</label><input id="assists" type="number" inputmode="numeric" /></div>
            <div><label>スペシャル (SP)</label><input id="specials" type="number" inputmode="numeric" /></div>
            <div><label>塗りポイント</label><input id="paint" type="number" inputmode="numeric" /></div>
          </div>

          <div>
            <label>備考</label>
            <textarea id="note" rows="2" placeholder="メモ"></textarea>
          </div>

          <div style="margin-top:12px; padding-top:12px; border-top:1px solid var(--border)">
            <div class="row" style="font-size:12px; color:var(--muted)">
              <label style="display:flex; align-items:center; gap:6px; margin:0; cursor:pointer">
                <input type="checkbox" id="useOnlineOcr" style="width:auto" />
                オンラインOCR補助（OCR.space）を使う
              </label>
            </div>
            <div id="apiKeyWrap" style="display:none; margin-top:6px">
              <label>OCR.space API Key</label>
              <input id="ocrApiKey" placeholder="未入力時はデモキー（制限あり）" />
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ===================== TAB: 記録一覧 ===================== -->
<div id="tab-records" class="page">
  <div class="row" style="justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:8px">
    <div style="font-size:16px; font-weight:700">記録一覧 <span id="recordCount" style="font-size:13px; color:var(--muted)"></span></div>
    <div class="row">
      <button id="exportCsv" class="btn">CSVエクスポート</button>
      <button id="clearAll" class="btn danger">全消去</button>
    </div>
  </div>
  <div class="filter-bar">
    <select id="filterResult"><option value="">勝敗：全て</option><option value="WIN">WIN</option><option value="LOSE">LOSE</option></select>
    <select id="filterMode"><option value="">ルール：全て</option></select>
    <select id="filterStage"><option value="">ステージ：全て</option></select>
    <select id="filterWeapon"><option value="">ブキ：全て</option></select>
    <input id="filterText" placeholder="フリー検索…" style="min-width:160px" />
  </div>
  <div class="table-wrap">
    <table id="table">
      <thead>
        <tr>
          <th>#</th>
          <th>日時 <button class="sort-btn" data-col="matchAt">▲</button></th>
          <th>勝敗 <button class="sort-btn" data-col="result">▲</button></th>
          <th>ルール</th>
          <th>ステージ</th>
          <th>ブキ</th>
          <th>K <button class="sort-btn" data-col="kills">▲</button></th>
          <th>D <button class="sort-btn" data-col="deaths">▲</button></th>
          <th>A</th>
          <th>SP</th>
          <th>塗り <button class="sort-btn" data-col="paint">▲</button></th>
          <th>備考</th>
          <th></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<!-- ===================== TAB: 統計 ===================== -->
<div id="tab-stats" class="page">
  <div class="stats-grid" id="summaryCards"></div>
  <div class="charts-grid">
    <div class="chart-card" style="grid-column:1/-1">
      <h3>勝率推移（直近20試合）</h3>
      <canvas id="chartWinTrend" height="80"></canvas>
    </div>
    <div class="chart-card">
      <h3>ルール別 勝率</h3>
      <canvas id="chartModeWin"></canvas>
    </div>
    <div class="chart-card">
      <h3>ブキ 使用率 TOP10</h3>
      <canvas id="chartWeapon"></canvas>
    </div>
    <div class="chart-card">
      <h3>ステージ別 勝率</h3>
      <canvas id="chartStageWin"></canvas>
    </div>
    <div class="chart-card">
      <h3>K/D 分布</h3>
      <canvas id="chartKD"></canvas>
    </div>
  </div>
</div>

<script src="vendor/tesseract/tesseract.min.js"></script>
<script>
// ===================== 定数 =====================
const FIELDS = ["matchAt","result","mode","stage","weapon","kills","deaths","assists","specials","paint","note"];

const MODES = [
  'レギュラーマッチ','バンカラマッチ','バンカラマッチ（オープン）','バンカラマッチ（チャレンジ）',
  'Xマッチ','フェス（オープン）','フェス（チャレンジ）','プライベートマッチ','サーモンラン'
];
const STAGES = [
  'マテガイ放水路','ナメロウ金属','ユノハナ大渓谷','ゴンズイ地区','チョウザメ造船',
  'キンメダイ美術館','マヒマヒリゾート＆スパ','ザトウマーケット','スメーシーワールド',
  'マサバ海峡大橋','マンタマリア号','タラポートショッピングパーク','海女美術大学',
  'ショッツル鉱山','アロワナモール','ネギトロ炭鉱','クサヤ温泉','ヒラメが丘団地',
  'バイガイ亭','オヒョウ海運','スフィンクスちゃん','キャットフィッシュの水辺',
  'リュウグウターミナル','ムツゴ楼','カジキ空港','マリナーラストリート'
];
const WEAPONS = [
  'わかばシューター','もみじシューター','スプラシューター','プロモデラーMG','プロモデラーRG',
  'N-ZAP85','N-ZAP89','.52ガロン','.96ガロン','ジェットスイーパー','ジェットスイーパーカスタム',
  'プライムシューター','プライムシューターコラボ','シャープマーカー','シャープマーカーネオ',
  'ボールドマーカー','ボールドマーカーネオ','スプラシューターコラボ','14式竹筒銃・甲',
  'スプラローラー','スプラローラーコラボ','ダイナモローラー','ダイナモローラーテスラ',
  'カーボンローラー','カーボンローラーデコ','ヴァリアブルローラー','ヴァリアブルローラーフォイル',
  'スプラマニューバー','スプラマニューバーコラボ','デュアルスイーパー','デュアルスイーパーカスタム',
  'スパッタリー','スパッタリーヒュー','クアッドホッパーブラック','クアッドホッパーホワイト',
  'パラシェルター','パラシェルターソレーラ','キャンピングシェルター','キャンピングシェルターカモ',
  'ノヴァブラスター','ノヴァブラスターネオ','ラピッドブラスター','ラピッドブラスターデコ',
  'ロングブラスター','ロングブラスターカスタム','クラッシュブラスター','クラッシュブラスターネオ',
  'リッター4K','リッター4Kカスタム','スプラチャージャー','スプラチャージャーコラボ',
  'スクイックリンα','スクイックリンβ','スプラスピナー','スプラスピナーコラボ',
  'バレルスピナー','バレルスピナーデコ','ハイドラント','ハイドラントカスタム',
  'バケットスロッシャー','バケットスロッシャーデコ','ヒッセン','ヒッセンヒュー',
  'スクリュースロッシャー','スクリュースロッシャーネオ','オーバーフロッシャー','エクスプロッシャー',
  'ボトルガイザー','ボトルガイザーフォイル','フィッシュフライヤー',
  'スプラストリンガー','スプラストリンガーコラボ','トライストリンガー','トライストリンガーコラボ',
  'LACT-450','LACT-450デコ'
];

// ===================== State =====================
const state = {
  image: null,
  originalBitmap: null,
  imageCanvas: null,
  width: 0, height: 0,
  rotation: 0,
  orientationCache: new Map(),
  rows: JSON.parse(localStorage.getItem('spla-rows') || '[]'),
  sortCol: null,
  sortDir: 1
};

// ===================== Utils =====================
const $ = id => document.getElementById(id);
function normalizeRotation(r) { return (((r % 360) + 360) % 360 / 90 | 0) * 90; }
function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
function csvEscape(s) { const t = String(s || ''); return (t.includes('"') || t.includes(',') || t.includes('\n')) ? '"' + t.replace(/"/g, '""') + '"' : t; }
function fmtRow(v) { return [v.matchAt,v.result,v.mode,v.stage,v.weapon,v.kills,v.deaths,v.assists,v.specials,v.paint,v.note].map(csvEscape).join(','); }
function values() { const v = {}; for (const k of FIELDS) v[k] = String($(k).value || '').trim(); return v; }
function setValues(v) { for (const k of FIELDS) if (k in v) $(k).value = v[k] ?? ''; }
function download(name, text) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type:'text/csv;charset=utf-8;'})); a.download = name; a.click(); }
function saveRows() { localStorage.setItem('spla-rows', JSON.stringify(state.rows)); }

// ===================== OCR 前処理（強化版） =====================
function otsuThreshold(data) {
  const hist = new Array(256).fill(0);
  let total = 0;
  for (let i = 0; i < data.length; i += 4) {
    const v = (data[i] * 299 + data[i+1] * 587 + data[i+2] * 114) / 1000 | 0;
    hist[Math.min(255, v)]++;
    total++;
  }
  let sum = 0; for (let i = 0; i < 256; i++) sum += i * hist[i];
  let sumB = 0, wB = 0, maxVar = 0, threshold = 128;
  for (let t = 0; t < 256; t++) {
    wB += hist[t]; if (!wB) continue;
    const wF = total - wB; if (!wF) break;
    sumB += t * hist[t];
    const mB = sumB / wB, mF = (sum - sumB) / wF;
    const v = wB * wF * (mB - mF) * (mB - mF);
    if (v > maxVar) { maxVar = v; threshold = t; }
  }
  return threshold;
}

function cropToCanvas(src, roi) {
  const sx = Math.round(roi.x * src.width), sy = Math.round(roi.y * src.height);
  const sw = Math.round(roi.w * src.width), sh = Math.round(roi.h * src.height);
  const out = document.createElement('canvas'); out.width = sw; out.height = sh;
  out.getContext('2d').drawImage(src, sx, sy, sw, sh, 0, 0, sw, sh);
  return out;
}

function prepareForOcr(src, kind) {
  // 1. Upscale 3x (up from 2.2x)
  const scale = 3;
  const up = document.createElement('canvas');
  up.width = Math.max(1, src.width * scale);
  up.height = Math.max(1, src.height * scale);
  const upCtx = up.getContext('2d');
  upCtx.imageSmoothingEnabled = true;
  upCtx.imageSmoothingQuality = 'high';
  upCtx.drawImage(src, 0, 0, up.width, up.height);

  // 2. Contrast + desaturate via CSS filter
  const filtered = document.createElement('canvas');
  filtered.width = up.width; filtered.height = up.height;
  const fCtx = filtered.getContext('2d');
  fCtx.filter = 'contrast(1.8) brightness(1.05) saturate(0)';
  fCtx.drawImage(up, 0, 0);

  // 3. Otsu auto-binarize
  const imgData = fCtx.getImageData(0, 0, filtered.width, filtered.height);
  const d = imgData.data;
  const thresh = otsuThreshold(d);
  for (let i = 0; i < d.length; i += 4) {
    const v = (d[i] * 299 + d[i+1] * 587 + d[i+2] * 114) / 1000 | 0;
    const t = v > thresh ? 255 : 0;
    d[i] = t; d[i+1] = t; d[i+2] = t; d[i+3] = 255;
  }
  fCtx.putImageData(imgData, 0, 0);

  // 4. If text appears to be light-on-dark, also try inverted version
  // Return the primary version (Tesseract handles both via PSM)
  return filtered;
}

// ===================== Tesseract worker =====================
const ocrEngine = { worker: null, currentLang: null, loadedLangs: new Set(), initPromise: null };

async function ensureTesseractWorker(lang) {
  if (!window.Tesseract) throw new Error('TESSERACT_NOT_AVAILABLE');
  if (!ocrEngine.worker) {
    if (!ocrEngine.initPromise) {
      ocrEngine.initPromise = (async () => {
        const cores = ['tesseract-core-simd.wasm.js', 'tesseract-core.wasm.js'];
        let lastErr;
        for (const core of cores) {
          try {
            const w = await Tesseract.createWorker({
              workerPath: 'vendor/tesseract/worker.min.js',
              corePath: `vendor/tesseract/${core}`,
              langPath: 'vendor/tesseract/lang-data',
              cachePath: 'vendor/tesseract/lang-data'
            });
            await w.load();
            return w;
          } catch(e) { lastErr = e; }
        }
        throw lastErr || new Error('Tesseract init failed');
      })();
    }
    ocrEngine.worker = await ocrEngine.initPromise;
  }
  const missing = lang.split('+').filter(c => !ocrEngine.loadedLangs.has(c));
  if (missing.length) {
    await ocrEngine.worker.loadLanguage(missing.join('+'));
    missing.forEach(c => ocrEngine.loadedLangs.add(c));
  }
  if (ocrEngine.currentLang !== lang) {
    await ocrEngine.worker.initialize(lang);
    ocrEngine.currentLang = lang;
  }
  return ocrEngine.worker;
}

async function recognizeLocally(canvas, lang, kind) {
  const worker = await ensureTesseractWorker(lang);
  // Per-field optimal PSM:
  //   PSM 7 = single line   → result(WIN/LOSE), numbers
  //   PSM 8 = single word   → not used
  //   PSM 6 = block of text → Japanese text fields
  const psm = (kind === 'num' || kind === 'word') ? '7' : '6';
  const params = {
    tessedit_ocr_engine_mode: '1',      // LSTM only (most accurate)
    tessedit_pageseg_mode: psm,
    preserve_interword_spaces: '1',
    user_defined_dpi: '300'
  };
  if (kind === 'num') {
    params.tessedit_char_whitelist = '0123456789';
    params.classify_bln_numeric_mode = '1';
  } else if (kind === 'word') {
    params.tessedit_char_whitelist = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ ';
  }
  await worker.setParameters(params);
  const { data } = await worker.recognize(canvas);
  return ((data && data.text) || '').replace(/\s+/g, ' ').trim();
}

async function ocrSpace(canvas, lang) {
  const apiKey = ($('ocrApiKey').value || '').trim() || 'helloworld';
  const fd = new FormData();
  fd.append('apikey', apiKey);
  fd.append('base64Image', canvas.toDataURL('image/png'));
  fd.append('language', lang === 'jpn' ? 'jpn' : 'eng');
  fd.append('scale', 'true');
  fd.append('OCREngine', '2');
  const res = await fetch('https://api.ocr.space/parse/image', { method: 'POST', body: fd });
  const j = await res.json();
  if (!res.ok || j.IsErroredOnProcessing) throw new Error('OCR API error');
  return ((j.ParsedResults?.[0]?.ParsedText) || '').replace(/\t/g, ' ').replace(/\n/g, ' ').trim();
}

async function detectAndOcr(binCanvas, lang, kind) {
  if ('TextDetector' in window) {
    try {
      const boxes = await new window.TextDetector().detect(await createImageBitmap(binCanvas));
      if (boxes?.length) return boxes.map(b => b.rawValue || '').join(' ').trim();
    } catch(_) {}
  }
  try {
    const localLang = lang === 'jpn' ? 'jpn+eng' : 'eng';
    const text = await recognizeLocally(binCanvas, localLang, kind);
    if (text) return text;
  } catch(err) {
    if (err?.message === 'TESSERACT_NOT_AVAILABLE') throw err;
  }
  if ($('useOnlineOcr').checked) return await ocrSpace(binCanvas, lang);
  return '';
}

// ===================== 正規化・辞書補正 =====================
function hiraganaToKatakana(s) { return (s||'').replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60)); }
function zenkakuToHankaku(s) { return (s||'').replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/　/g, ' '); }
function hankakuKatakanaToZenkaku(s) {
  // voiced/semi-voiced combining pairs first
  const voiced = {'ｶ':'ガ','ｷ':'ギ','ｸ':'グ','ｹ':'ゲ','ｺ':'ゴ','ｻ':'ザ','ｼ':'ジ','ｽ':'ズ','ｾ':'ゼ','ｿ':'ゾ','ﾀ':'ダ','ﾁ':'ヂ','ﾂ':'ヅ','ﾃ':'デ','ﾄ':'ド','ﾊ':'バ','ﾋ':'ビ','ﾌ':'ブ','ﾍ':'ベ','ﾎ':'ボ','ｳ':'ヴ'};
  const semi   = {'ﾊ':'パ','ﾋ':'ピ','ﾌ':'プ','ﾍ':'ペ','ﾎ':'ポ'};
  const single = {'ｦ':'ヲ','ｧ':'ァ','ｨ':'ィ','ｩ':'ゥ','ｪ':'ェ','ｫ':'ォ','ｬ':'ャ','ｭ':'ュ','ｮ':'ョ','ｯ':'ッ','ｰ':'ー','ｱ':'ア','ｲ':'イ','ｳ':'ウ','ｴ':'エ','ｵ':'オ','ｶ':'カ','ｷ':'キ','ｸ':'ク','ｹ':'ケ','ｺ':'コ','ｻ':'サ','ｼ':'シ','ｽ':'ス','ｾ':'セ','ｿ':'ソ','ﾀ':'タ','ﾁ':'チ','ﾂ':'ツ','ﾃ':'テ','ﾄ':'ト','ﾅ':'ナ','ﾆ':'ニ','ﾇ':'ヌ','ﾈ':'ネ','ﾉ':'ノ','ﾊ':'ハ','ﾋ':'ヒ','ﾌ':'フ','ﾍ':'ヘ','ﾎ':'ホ','ﾏ':'マ','ﾐ':'ミ','ﾑ':'ム','ﾒ':'メ','ﾓ':'モ','ﾔ':'ヤ','ﾕ':'ユ','ﾖ':'ヨ','ﾗ':'ラ','ﾘ':'リ','ﾙ':'ル','ﾚ':'レ','ﾛ':'ロ','ﾜ':'ワ','ﾝ':'ン','ﾞ':'゛','ﾟ':'゜'};
  let out = '';
  for (let i = 0; i < s.length; i++) {
    const c = s[i], next = s[i+1];
    if (next === 'ﾞ' && voiced[c])  { out += voiced[c];  i++; }
    else if (next === 'ﾟ' && semi[c]) { out += semi[c];   i++; }
    else out += single[c] || c;
  }
  return out;
}
function jaNormalize(s) { let t = s || ''; t = t.replace(/\s+/g,' ').trim(); t = zenkakuToHankaku(t); t = hankakuKatakanaToZenkaku(t); t = hiraganaToKatakana(t); t = t.replace(/["'`\[\]{}()]/g, ''); return t; }

function levenshtein(a, b) {
  a = a || ''; b = b || '';
  const m = a.length, n = b.length;
  const dp = Array.from({length: m+1}, () => Array(n+1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) {
    const cost = a[i-1] === b[j-1] ? 0 : 1;
    dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+cost);
  }
  return dp[m][n];
}

function bestMatch(src, cands) {
  const s = jaNormalize(src);
  let best = { label: '', score: 0 };
  for (const c of cands) {
    const t = jaNormalize(c);
    const score = 1 - levenshtein(s, t) / Math.max(1, Math.max(s.length, t.length));
    if (score > best.score) best = { label: c, score };
  }
  return best;
}

function extractNumbers(s) {
  const nums = []; let cur = '';
  for (const ch of (s || '')) {
    if (ch >= '0' && ch <= '9') cur += ch;
    else { if (cur) { nums.push(parseInt(cur, 10)); cur = ''; } }
  }
  if (cur) nums.push(parseInt(cur, 10));
  return nums;
}

function parseKD(text) {
  const ns = extractNumbers(text || '');
  const out = {};
  if (ns.length >= 1) out.kills = ns[0];
  if (ns.length >= 2) out.deaths = ns[1];
  if (ns.length >= 3) out.assists = ns[2];
  return out;
}

// ===================== ROI definitions =====================
const ROI_SET_A = {
  result:  { x:0.04, y:0.06, w:0.18, h:0.08 },
  kd:      { x:0.74, y:0.62, w:0.20, h:0.10 },
  paint:   { x:0.78, y:0.80, w:0.16, h:0.08 },
  stage:   { x:0.33, y:0.18, w:0.34, h:0.08 },
  mode:    { x:0.33, y:0.11, w:0.34, h:0.06 },
  weapon:  { x:0.16, y:0.62, w:0.28, h:0.10 }
};
const ROI_SET_B = {
  result:  { x:0.05, y:0.10, w:0.22, h:0.12 },
  kd:      { x:0.70, y:0.60, w:0.26, h:0.14 },
  paint:   { x:0.75, y:0.78, w:0.20, h:0.10 },
  stage:   { x:0.28, y:0.16, w:0.42, h:0.10 },
  mode:    { x:0.28, y:0.08, w:0.42, h:0.08 },
  weapon:  { x:0.12, y:0.58, w:0.34, h:0.14 }
};

function detectArrowRow(canvas) {
  try {
    const ctx = canvas.getContext('2d');
    const { width, height } = canvas;
    const x0 = Math.floor(width * 0.02), x1 = Math.floor(width * 0.12);
    const sw = Math.max(1, x1 - x0);
    const data = ctx.getImageData(x0, 0, sw, height).data;
    let bestY = -1, bestScore = 0;
    for (let y = 0; y < height; y++) {
      let score = 0; const base = y * sw * 4;
      for (let x = 0; x < sw; x++) {
        const i = base + x * 4;
        const r = data[i], g = data[i+1], b = data[i+2];
        if (r > 210 && g > 190 && b < 160) score += (r + g) - b;
      }
      if (score > bestScore) { bestScore = score; bestY = y; }
    }
    return bestScore < 4000 ? null : bestY / height;
  } catch(_) { return null; }
}

function getPortraitRoiSets(canvas) {
  const aspect = canvas.width / canvas.height;
  const detected = detectArrowRow(canvas);
  const fallback = aspect > 2.1 ? 0.64 : 0.6;
  const center = clamp(detected ?? fallback, 0.36, 0.82);
  const rh = 0.095;
  const top = clamp(center - rh, 0.32, 0.75);
  const bot = clamp(center + rh, top + 0.05, 0.9);
  const h = bot - top;
  return [
    { result:{x:0.39,y:0.1,w:0.24,h:0.16}, kd:{x:0.55,y:top,w:0.28,h}, paint:{x:0.84,y:top,w:0.12,h}, stage:{x:0.63,y:0.14,w:0.32,h:0.12}, mode:{x:0.36,y:0.03,w:0.28,h:0.09}, weapon:{x:0.1,y:top,w:0.34,h} },
    { result:{x:0.32,y:0.09,w:0.34,h:0.18}, kd:{x:0.5,y:Math.max(0.3,top-0.02),w:0.32,h:Math.min(0.95,h+0.04)}, paint:{x:0.82,y:Math.max(0.3,top-0.02),w:0.15,h:Math.min(0.95,h+0.04)}, stage:{x:0.58,y:0.12,w:0.38,h:0.14}, mode:{x:0.3,y:0.02,w:0.36,h:0.1}, weapon:{x:0.08,y:Math.max(0.3,top-0.02),w:0.36,h:Math.min(0.95,h+0.04)} }
  ];
}

// SplatNet3 iPhoneスクショ（縦画面: 幅 < 高さ）専用ROI
// レイアウト: 上部にステージ名・ルール → 中段にWIN/LOSEバナー → 下部にプレイヤー行
function getSplatNetPortraitRoiSets(canvas) {
  const detected = detectArrowRow(canvas);
  // 矢印行が見つかれば利用、なければ典型的な位置（LOSE側プレイヤーは約65%付近）
  const arrowY = clamp(detected ?? 0.65, 0.30, 0.85);
  const rh = 0.035;
  const playerTop = clamp(arrowY - rh, 0.28, 0.82);
  const playerBot = clamp(arrowY + rh, playerTop + 0.03, 0.90);
  const rowH = playerBot - playerTop;

  // resultは WIN!/LOSE... バナーが縦に並ぶ領域を広めに取る（どちらかが読める）
  // 勝者チームバナー(~37-41%)・敗者チームバナー(~56-61%)を両方カバー
  const base = {
    mode:   { x:0.05, y:0.09, w:0.65, h:0.10 },
    stage:  { x:0.20, y:0.03, w:0.75, h:0.09 },
    result: { x:0.05, y:0.34, w:0.65, h:0.30 },  // WIN/LOSE両バナーカバー
    weapon: { x:0.05, y:playerTop, w:0.50, h:rowH },
    kd:     { x:0.54, y:clamp(playerTop-0.01,0,1), w:0.28, h:Math.min(rowH+0.02,0.12) },
    paint:  { x:0.75, y:playerTop, w:0.20, h:rowH },
  };
  const alt = {
    mode:   { x:0.03, y:0.07, w:0.75, h:0.12 },
    stage:  { x:0.10, y:0.02, w:0.88, h:0.10 },
    result: { x:0.03, y:0.32, w:0.70, h:0.33 },
    weapon: { x:0.03, y:clamp(playerTop-0.02,0,1), w:0.55, h:Math.min(rowH+0.04,0.12) },
    kd:     { x:0.50, y:clamp(playerTop-0.02,0,1), w:0.32, h:Math.min(rowH+0.04,0.12) },
    paint:  { x:0.73, y:clamp(playerTop-0.01,0,1), w:0.23, h:Math.min(rowH+0.02,0.12) },
  };
  return [base, alt];
}

function roiCandidates(canvas) {
  const aspect = canvas.width / canvas.height;
  if (aspect < 0.75) return getSplatNetPortraitRoiSets(canvas); // 縦画面(SplatNet3等)
  if (aspect > 1.95) return getPortraitRoiSets(canvas);         // 超横長
  return [ROI_SET_A, ROI_SET_B];                                 // Switch横画面
}

async function runWithRoiSet(canvas, ROIS) {
  setOcrStatus('フィールド解析中…', 30);
  const out = {};
  const fields = ['result','kd','paint','stage','mode','weapon'];
  for (const name of fields) {
    const crop = cropToCanvas(canvas, ROIS[name]);
    const bin = prepareForOcr(crop, name === 'kd' || name === 'paint' ? 'num' : 'word');
    try {
      if (name === 'kd' || name === 'paint') out[name] = await detectAndOcr(bin, 'eng', 'num');
      else if (name === 'result') out[name] = await detectAndOcr(bin, 'eng', 'word');
      else out[name] = await detectAndOcr(bin, 'jpn', 'word');
    } catch(e) { out[name] = ''; }
  }
  return out;
}

function scoreResult(out) {
  return bestMatch(out.mode||'', MODES).score + bestMatch(out.stage||'', STAGES).score + bestMatch(out.weapon||'', WEAPONS).score;
}

async function analyzeWithRoiSets(canvas) {
  const candidates = roiCandidates(canvas);
  let best = null;
  for (const roi of candidates) {
    try {
      const out = await runWithRoiSet(canvas, roi);
      const score = scoreResult(out);
      if (!best || score > best.score) best = { score, raw: out };
    } catch(e) { console.warn('[OCR] candidate failed', e); }
  }
  return best;
}

function postCorrect(out) {
  const r = (out.result || '').toUpperCase();
  let result = '';
  if (r.includes('WIN') || r.includes('VICTORY')) result = 'WIN';
  else if (r.includes('LOSE') || r.includes('DEFEAT') || r.includes('LOST')) result = 'LOSE';

  const kd = parseKD(out.kd || '');
  const paintNum = (out.paint || '').replace(/[^0-9]/g, '');
  const bmMode   = bestMatch(out.mode   || '', MODES);
  const bmStage  = bestMatch(out.stage  || '', STAGES);
  const bmWeapon = bestMatch(out.weapon || '', WEAPONS);

  return {
    matchAt: new Date().toISOString().slice(0,16).replace('T',' '),
    result,
    mode:   bmMode.score   >= 0.5 ? bmMode.label   : jaNormalize(out.mode   || ''),
    stage:  bmStage.score  >= 0.5 ? bmStage.label  : jaNormalize(out.stage  || ''),
    weapon: bmWeapon.score >= 0.5 ? bmWeapon.label : jaNormalize(out.weapon || ''),
    kills:   kd.kills   !== undefined ? String(kd.kills)   : '',
    deaths:  kd.deaths  !== undefined ? String(kd.deaths)  : '',
    assists: kd.assists !== undefined ? String(kd.assists) : '',
    specials: '',
    paint: paintNum,
    note: ''
  };
}

// ===================== 画像処理 =====================
function createCanvasFromBitmap(bitmap, rotation) {
  const rot = normalizeRotation(rotation);
  const swap = rot === 90 || rot === 270;
  const c = document.createElement('canvas');
  c.width = swap ? bitmap.height : bitmap.width;
  c.height = swap ? bitmap.width : bitmap.height;
  const ctx = c.getContext('2d');
  ctx.save(); ctx.translate(c.width/2, c.height/2);
  ctx.rotate(rot * Math.PI / 180);
  ctx.drawImage(bitmap, -bitmap.width/2, -bitmap.height/2);
  ctx.restore(); return c;
}

function getCanvasForRotation(rot) {
  const r = normalizeRotation(rot);
  if (!state.orientationCache.has(r)) state.orientationCache.set(r, createCanvasFromBitmap(state.originalBitmap, r));
  return state.orientationCache.get(r);
}

function setRotation(rot) {
  if (!state.originalBitmap) return;
  const r = normalizeRotation(rot);
  state.rotation = r; state.imageCanvas = getCanvasForRotation(r);
  if (state.imageCanvas) { state.width = state.imageCanvas.width; state.height = state.imageCanvas.height; }
  drawPreview(); updateImgMeta();
}

function drawPreview() {
  const c = $('preview');
  if (!state.imageCanvas) { c.getContext('2d').clearRect(0,0,c.width,c.height); return; }
  c.width = state.imageCanvas.width; c.height = state.imageCanvas.height;
  c.getContext('2d').drawImage(state.imageCanvas, 0, 0);
}

function updateImgMeta() {
  $('imgMeta').textContent = state.image ? `${state.image.name}  /  ${state.width}×${state.height}  /  ${state.rotation}°` : '画像未読込';
}

function setButtons(enabled) {
  for (const id of ['auto','reset','copyCsv','append','rotateLeft','rotateRight']) {
    const el = $(id); if (el) el.disabled = !enabled;
  }
}

async function safeLoadImage(file) {
  if (!file) return;
  if (!/^image\/(png|jpeg|jpg)/.test(file.type || '')) { alert('PNG/JPGのみ対応しています。'); return; }
  try {
    const bmp = await createImageBitmap(file);
    state.image = file; state.originalBitmap = bmp; state.orientationCache = new Map();
    setRotation(0); setButtons(true);
  } catch(e) { alert('画像の読み込みに失敗しました: ' + e.message); }
}

// ===================== OCR Progress =====================
function setOcrStatus(msg, pct) {
  $('ocrStatus').textContent = msg;
  $('progressBar').style.width = pct + '%';
}

async function autoAnalyze() {
  if (!state.originalBitmap) return;
  $('auto').disabled = true;
  $('auto').textContent = '解析中…';
  $('ocrProgress').style.display = 'block';
  setOcrStatus('Tesseractモデルを読み込み中…', 10);
  try {
    // 縦画面（SplatNet3スクショ等）は0°/180°のみ試す。横画面は4方向。
    const isPortrait = state.originalBitmap.height > state.originalBitmap.width;
    const candidateRots = isPortrait ? [0, 180] : [0, 90, 180, 270];
    const rotations = [...new Set([state.rotation, ...candidateRots].map(normalizeRotation))];
    let best = null;
    for (const rot of rotations) {
      const canvas = getCanvasForRotation(rot);
      if (!canvas) continue;
      setOcrStatus(`回転 ${rot}° で解析中…`, 20 + rotations.indexOf(rot) * 20);
      const analysis = await analyzeWithRoiSets(canvas);
      if (!best || analysis.score > best.score) best = { ...analysis, rotation: rot };
    }
    setOcrStatus('辞書補正中…', 85);
    if (!best) throw new Error('no result');
    setRotation(best.rotation);
    setValues(postCorrect(best.raw));
    setOcrStatus('完了', 100);
    setTimeout(() => { $('ocrProgress').style.display = 'none'; }, 1000);
  } catch(err) {
    $('ocrProgress').style.display = 'none';
    alert('OCRエラー: ' + (err?.message || err));
  } finally {
    $('auto').disabled = false;
    $('auto').textContent = '🔍 自動解析';
  }
}

// ===================== Table =====================
function filteredRows() {
  const fResult = $('filterResult').value;
  const fMode   = $('filterMode').value;
  const fStage  = $('filterStage').value;
  const fWeapon = $('filterWeapon').value;
  const fText   = ($('filterText').value || '').toLowerCase();
  return state.rows.filter(r => {
    if (fResult && r.result !== fResult) return false;
    if (fMode   && r.mode   !== fMode)   return false;
    if (fStage  && r.stage  !== fStage)  return false;
    if (fWeapon && r.weapon !== fWeapon) return false;
    if (fText && !JSON.stringify(r).toLowerCase().includes(fText)) return false;
    return true;
  });
}

function renderTable() {
  const rows = filteredRows();
  if (state.sortCol) {
    rows.sort((a, b) => {
      const av = isNaN(a[state.sortCol]) ? String(a[state.sortCol]||'') : Number(a[state.sortCol]||0);
      const bv = isNaN(b[state.sortCol]) ? String(b[state.sortCol]||'') : Number(b[state.sortCol]||0);
      return av < bv ? -state.sortDir : av > bv ? state.sortDir : 0;
    });
  }
  const tb = document.querySelector('#table tbody');
  tb.innerHTML = '';
  rows.forEach((r, i) => {
    const tr = document.createElement('tr');
    const resultBadge = r.result === 'WIN' ? `<span class="badge win">WIN</span>` : r.result === 'LOSE' ? `<span class="badge lose">LOSE</span>` : (r.result || '');
    const cells = [i+1, r.matchAt, resultBadge, r.mode, r.stage, r.weapon, r.kills, r.deaths, r.assists, r.specials, r.paint, r.note, `<button class="btn danger" style="padding:4px 8px;font-size:11px" data-idx="${state.rows.indexOf(r)}">削除</button>`];
    cells.forEach((c, ci) => {
      const td = document.createElement('td');
      if (ci === 2 || ci === 12) td.innerHTML = c || '';
      else td.textContent = c ?? '';
      tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
  $('recordCount').textContent = `(${rows.length}件 / 全${state.rows.length}件)`;
  updateFilterOptions();
}

function updateFilterOptions() {
  const modes   = [...new Set(state.rows.map(r => r.mode).filter(Boolean))];
  const stages  = [...new Set(state.rows.map(r => r.stage).filter(Boolean))];
  const weapons = [...new Set(state.rows.map(r => r.weapon).filter(Boolean))];
  const rebuild = (id, vals) => {
    const sel = $(id); const cur = sel.value;
    sel.innerHTML = sel.options[0].outerHTML;
    vals.sort().forEach(v => { const o = document.createElement('option'); o.value = o.textContent = v; sel.appendChild(o); });
    sel.value = cur;
  };
  rebuild('filterMode', modes); rebuild('filterStage', stages); rebuild('filterWeapon', weapons);
}

// ===================== Statistics / Charts =====================
let chartInstances = {};

function renderStats() {
  const rows = state.rows;
  if (!rows.length) {
    $('summaryCards').innerHTML = '<div style="color:var(--muted);font-size:13px">記録がありません</div>';
    return;
  }
  const wins = rows.filter(r => r.result === 'WIN').length;
  const total = rows.length;
  const winRate = total ? (wins / total * 100).toFixed(1) : '—';
  const kds = rows.filter(r => r.kills && r.deaths).map(r => Number(r.kills) / Math.max(1, Number(r.deaths)));
  const avgKD = kds.length ? (kds.reduce((a,b)=>a+b,0) / kds.length).toFixed(2) : '—';
  const paints = rows.filter(r => r.paint).map(r => Number(r.paint));
  const avgPaint = paints.length ? Math.round(paints.reduce((a,b)=>a+b,0) / paints.length) : '—';
  const kills = rows.filter(r => r.kills).map(r => Number(r.kills));
  const avgK = kills.length ? (kills.reduce((a,b)=>a+b,0) / kills.length).toFixed(1) : '—';

  $('summaryCards').innerHTML = [
    ['総試合数', total, `WIN ${wins} / LOSE ${total-wins}`],
    ['勝率', winRate + '%', `${wins}勝 ${total-wins}敗`],
    ['平均 K/D', avgKD, `平均キル ${avgK}`],
    ['平均塗り', avgPaint, 'ポイント']
  ].map(([lbl, val, sub]) => `
    <div class="stat-card">
      <div class="lbl">${lbl}</div>
      <div class="val">${val}</div>
      <div class="sub">${sub}</div>
    </div>`).join('');

  renderCharts(rows);
}

const CHART_COLORS = ['#7c3aed','#22c55e','#f59e0b','#ef4444','#06b6d4','#ec4899','#84cc16','#f97316','#a855f7','#14b8a6'];

function destroyChart(id) { if (chartInstances[id]) { chartInstances[id].destroy(); delete chartInstances[id]; } }

function renderCharts(rows) {
  const darkOpts = {
    plugins: { legend: { labels: { color: '#94a3b8', font: { size: 11 } } } },
    scales: { x: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#1e1e38' } }, y: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#1e1e38' } } }
  };

  // 1. Win rate trend (rolling average last 20)
  destroyChart('chartWinTrend');
  const recent = rows.slice(-20);
  const trendLabels = recent.map((_, i) => `#${rows.length - recent.length + i + 1}`);
  const trendData = recent.map((_, i) => {
    const slice = recent.slice(0, i+1);
    const w = slice.filter(r => r.result === 'WIN').length;
    return +(w / slice.length * 100).toFixed(1);
  });
  chartInstances['chartWinTrend'] = new Chart($('chartWinTrend'), {
    type: 'line',
    data: { labels: trendLabels, datasets: [{ label: '勝率 %', data: trendData, borderColor: '#7c3aed', backgroundColor: 'rgba(124,58,237,.15)', fill: true, tension: 0.4, pointRadius: 3 }] },
    options: { ...darkOpts, plugins: { ...darkOpts.plugins, tooltip: { callbacks: { label: c => `勝率 ${c.raw}%` } } } }
  });

  // 2. Mode win rate
  destroyChart('chartModeWin');
  const modeData = {};
  rows.forEach(r => {
    if (!r.mode) return;
    if (!modeData[r.mode]) modeData[r.mode] = {w:0,t:0};
    modeData[r.mode].t++; if (r.result==='WIN') modeData[r.mode].w++;
  });
  const modeLabels = Object.keys(modeData);
  chartInstances['chartModeWin'] = new Chart($('chartModeWin'), {
    type: 'bar',
    data: { labels: modeLabels, datasets: [{ label: '勝率 %', data: modeLabels.map(k => +(modeData[k].w/modeData[k].t*100).toFixed(1)), backgroundColor: '#7c3aed66', borderColor: '#7c3aed', borderWidth: 1 }] },
    options: { ...darkOpts, plugins: { ...darkOpts.plugins, legend: { display: false } }, scales: { ...darkOpts.scales, y: { ...darkOpts.scales.y, max: 100, min: 0 } } }
  });

  // 3. Weapon usage top 10
  destroyChart('chartWeapon');
  const wpnCount = {};
  rows.forEach(r => { if (r.weapon) wpnCount[r.weapon] = (wpnCount[r.weapon]||0) + 1; });
  const wpnSorted = Object.entries(wpnCount).sort((a,b)=>b[1]-a[1]).slice(0,10);
  chartInstances['chartWeapon'] = new Chart($('chartWeapon'), {
    type: 'doughnut',
    data: { labels: wpnSorted.map(x=>x[0]), datasets: [{ data: wpnSorted.map(x=>x[1]), backgroundColor: CHART_COLORS, borderColor: '#10101c', borderWidth: 2 }] },
    options: { plugins: { legend: { labels: { color: '#94a3b8', font: { size: 10 } } } } }
  });

  // 4. Stage win rate
  destroyChart('chartStageWin');
  const stageData = {};
  rows.forEach(r => {
    if (!r.stage) return;
    if (!stageData[r.stage]) stageData[r.stage] = {w:0,t:0};
    stageData[r.stage].t++; if (r.result==='WIN') stageData[r.stage].w++;
  });
  const sLabels = Object.keys(stageData).sort((a,b) => stageData[b].w/stageData[b].t - stageData[a].w/stageData[a].t);
  chartInstances['chartStageWin'] = new Chart($('chartStageWin'), {
    type: 'bar',
    data: { labels: sLabels, datasets: [{ label: '勝率 %', data: sLabels.map(k => +(stageData[k].w/stageData[k].t*100).toFixed(1)), backgroundColor: '#22c55e66', borderColor: '#22c55e', borderWidth: 1 }] },
    options: { ...darkOpts, indexAxis: 'y', plugins: { ...darkOpts.plugins, legend: { display: false } }, scales: { x: { ...darkOpts.scales.x, max: 100, min: 0 }, y: { ...darkOpts.scales.y } } }
  });

  // 5. K/D distribution
  destroyChart('chartKD');
  const kdBuckets = {'0-1':0,'1-2':0,'2-3':0,'3-5':0,'5+':0};
  rows.forEach(r => {
    if (!r.kills || !r.deaths) return;
    const kd = Number(r.kills) / Math.max(1, Number(r.deaths));
    if (kd < 1) kdBuckets['0-1']++;
    else if (kd < 2) kdBuckets['1-2']++;
    else if (kd < 3) kdBuckets['2-3']++;
    else if (kd < 5) kdBuckets['3-5']++;
    else kdBuckets['5+']++;
  });
  chartInstances['chartKD'] = new Chart($('chartKD'), {
    type: 'bar',
    data: { labels: Object.keys(kdBuckets), datasets: [{ label: '試合数', data: Object.values(kdBuckets), backgroundColor: '#f59e0b66', borderColor: '#f59e0b', borderWidth: 1 }] },
    options: { ...darkOpts, plugins: { ...darkOpts.plugins, legend: { display: false } } }
  });
}

// ===================== Tab navigation =====================
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    const page = $('tab-' + tab.dataset.tab);
    if (page) page.classList.add('active');
    if (tab.dataset.tab === 'records') renderTable();
    if (tab.dataset.tab === 'stats') renderStats();
  });
});

// ===================== UI events =====================
$('pick').addEventListener('click', e => { e.stopPropagation(); $('file').click(); });
$('file').addEventListener('change', e => { const f = e.target.files?.[0]; if (f) safeLoadImage(f); });
const drop = $('drop');
drop.addEventListener('click', e => { if (!e.target.closest('button')) $('file').click(); });
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag'); });
drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
drop.addEventListener('drop', async e => { e.preventDefault(); drop.classList.remove('drag'); const f = e.dataTransfer?.files?.[0]; if (f) await safeLoadImage(f); });
$('auto').addEventListener('click', autoAnalyze);
$('reset').addEventListener('click', () => location.reload());
$('rotateLeft').addEventListener('click',  () => { if (state.originalBitmap) setRotation(state.rotation - 90); });
$('rotateRight').addEventListener('click', () => { if (state.originalBitmap) setRotation(state.rotation + 90); });
$('copyCsv').addEventListener('click', async () => {
  const row = fmtRow(values());
  try { await navigator.clipboard.writeText(row); alert('CSVをコピーしました。'); }
  catch(_) { const ok = confirm('CSVをダウンロードしますか？'); if(ok) download('spla_row.csv', row + '\n'); }
});
$('append').addEventListener('click', () => { state.rows.push(values()); saveRows(); renderTable(); });
$('exportCsv').addEventListener('click', () => {
  const header = ['日時','勝敗','ルール','ステージ','ブキ','K','D','A','SP','塗り','備考'].join(',');
  download('splatoon3_records.csv', header + '\n' + state.rows.map(fmtRow).join('\n'));
});
$('clearAll').addEventListener('click', () => {
  if (!confirm('全記録を消去します。よろしいですか？')) return;
  state.rows = []; saveRows(); renderTable();
});
$('useOnlineOcr').addEventListener('change', e => { $('apiKeyWrap').style.display = e.target.checked ? 'block' : 'none'; });

// Sort buttons
document.querySelectorAll('.sort-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const col = btn.dataset.col;
    if (state.sortCol === col) state.sortDir *= -1; else { state.sortCol = col; state.sortDir = 1; }
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTable();
  });
});

// Table row delete
document.querySelector('#table tbody').addEventListener('click', e => {
  const btn = e.target.closest('[data-idx]'); if (!btn) return;
  const idx = parseInt(btn.dataset.idx, 10);
  if (!confirm('この記録を削除しますか？')) return;
  state.rows.splice(idx, 1); saveRows(); renderTable();
});

// Filter events
['filterResult','filterMode','filterStage','filterWeapon','filterText'].forEach(id => {
  $(id).addEventListener('input', renderTable);
});

// ===================== Init =====================
renderTable();
updateImgMeta();
